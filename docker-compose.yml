services:
  mysql:
    image: mysql:8.4
    container_name: e-ticaret-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: e_ticaret
      MYSQL_USER: e_ticaret
      MYSQL_PASSWORD: e_ticaret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
